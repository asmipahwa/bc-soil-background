[project]
name = "bc-soil-background"
version = "0.1.0"
description = "Independent student project: local background soil metals for Nanaimo–Cowichan, BC. Not for regulatory use."
authors = [
    { name = "Asmi Pahwa", email = "asmipahwa101@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geoalchemy2>=0.21.0",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.11",
    "psycopg[binary]>=3.3.9",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.2",
    "ruff>=0.17.6",
]

[project.scripts]
bcsb = "bc_soil_background.pipeline:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
