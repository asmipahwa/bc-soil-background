# Local PostgreSQL 16 + PostGIS for the pipeline. Nothing here leaves your machine.
# Host port 5433 avoids clashing with a locally installed Postgres on 5432.
name: bc-soil-background
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: soil
      POSTGRES_USER: soil
      POSTGRES_PASSWORD: soil   # local-only development password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soil -d soil"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
